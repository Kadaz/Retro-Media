<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS5 GBA Test</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#screen {
    width: 480px;
    height: 320px;
    max-width: 100vw;
    max-height: 70vh;
    image-rendering: pixelated;
    display: block;
    margin: 20px auto;
    background: #111;
}

#status {
    text-align: center;
    padding: 10px;
}

#start {
    display: block;
    margin: 15px auto;
    padding: 12px 25px;
    font-size: 18px;
}
</style>
</head>

<body>

<div id="status">
    Loading pure JavaScript GBA emulator...
</div>

<canvas id="screen" width="240" height="160"></canvas>

<button id="start">START GBA</button>

<script src="https://cdn.jsdelivr.net/gh/andychase/gbajs2@master/js/gba.js"></script>

<script>

const ROM_URL =
    "https://raw.githubusercontent.com/Kadaz/Retro-Media/main/roms//Metroid - Fusion.GBA";

let gba = null;

document.getElementById("start").addEventListener("click", async () => {

    const status =
        document.getElementById("status");

    status.textContent =
        "Downloading GBA ROM...";

    try {

        const response =
            await fetch(ROM_URL);

        if (!response.ok) {
            throw new Error(
                "ROM download failed: " +
                response.status
            );
        }

        const buffer =
            await response.arrayBuffer();

        status.textContent =
            "ROM downloaded. Starting emulator...";

        /*
         * Pure JavaScript GBA emulator.
         * No WebAssembly.
         */

        gba =
            new GameBoyAdvance();

        gba.setCanvas(
            document.getElementById("screen")
        );

        gba.loadRom(
            new Uint8Array(buffer)
        );

        gba.runStable();

        status.textContent =
            "GBA emulator running.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "ERROR: " + error.message;

    }

});

</script>

</body>
</html>
